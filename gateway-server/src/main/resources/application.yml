server:
  port: 8080

spring:
  application:
    name: gateway-server

jwt:
  secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS10aGF0LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHM=}

security:
  whitelist:
    - path: /api/auth/**
      methods: GET,POST,PUT
    - path: /api/products/**
      methods: GET,POST,PUT,DELETE
    - path: /api/promotions/**
      methods: GET,POST,PUT,DELETE
    - path: /actuator/**
      methods: GET

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

zuul:
  ignored-services: '*'
  sensitive-headers: Cookie,Set-Cookie
  ignored-headers: Access-Control-Allow-Credentials, Access-Control-Allow-Origin, Access-Control-Allow-Methods, Access-Control-Max-Age, Access-Control-Allow-Headers, Access-Control-Expose-Headers
  routes:
    auth-service:
      path: /api/auth/**
      service-id: auth-service
      strip-prefix: false
    product-service:
      path: /api/products/**
      service-id: product-service
      strip-prefix: false
    order-service:
      path: /api/orders/**
      service-id: order-service
      strip-prefix: false
    promotion-service:
      path: /api/promotions/**
      service-id: promotion-service
      strip-prefix: false

ribbon:
  ConnectTimeout: 3000
  ReadTimeout: 10000

hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 15000

management:
  endpoints:
    web:
      exposure:
        include: routes,filters,health
