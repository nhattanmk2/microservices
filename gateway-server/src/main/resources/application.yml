server:
  port: 8080

spring:
  application:
    name: gateway-server

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

zuul:
  ignored-services: '*'
  sensitive-headers: Cookie,Set-Cookie
  routes:
    auth-service:
      path: /api/auth/**
      service-id: auth-service
      strip-prefix: false
    product-service:
      path: /api/products/**
      service-id: product-service
      strip-prefix: false
    order-service:
      path: /api/orders/**
      service-id: order-service
      strip-prefix: false

ribbon:
  ConnectTimeout: 3000
  ReadTimeout: 10000

hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 15000

management:
  endpoints:
    web:
      exposure:
        include: routes,filters,health
