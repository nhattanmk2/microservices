version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: microservices-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # Uncomment the following block to auto-create databases on startup
    # volumes:
    #   - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data:
